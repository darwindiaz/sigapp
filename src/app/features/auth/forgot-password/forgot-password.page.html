<ion-content class="auth-content">
  <div class="auth-layout">
    <form
      class="auth-form"
      [formGroup]="form"
      [attr.aria-busy]="isSubmitting"
      (ngSubmit)="onSubmit()"
    >
      <app-logo></app-logo>

      <h1 class="auth-title">Recuperar contraseña</h1>
      <p class="auth-description">
        Ingresa el correo asociado a tu cuenta para recibir el enlace de
        recuperación.
      </p>

      <app-custom-input
        type="email"
        icon="mail-outline"
        label="Correo electrónico"
        autoComplete="email"
        formatMessage="Ingresa un correo electrónico válido."
        [control]="form.controls.email"
      ></app-custom-input>

      <ion-button
        type="submit"
        expand="block"
        [disabled]="form.invalid || isSubmitting"
      >
        {{ isSubmitting ? 'Enviando...' : 'Enviar enlace' }}
      </ion-button>

      <ion-button
        type="button"
        expand="block"
        fill="clear"
        routerLink="/auth"
      >
        Volver al inicio de sesión
      </ion-button>
    </form>
  </div>
</ion-content>
