<ion-content class="auth-content">
  <div class="auth-layout">
    <form
      class="auth-form"
      [formGroup]="formAuth"
      [attr.aria-busy]="isSubmitting"
      (ngSubmit)="onSubmit()"
    >
      <app-logo></app-logo>
      <h1 class="auth-title">Iniciar sesión</h1>
      <app-custom-input
        type="email"
        icon="person-circle-outline"
        label="Usuario"
        autoComplete="email"
        formatMessage="Ingresa un correo electrónico válido."
        [control]="$any(formAuth).get('email')"
      ></app-custom-input>
      <app-custom-input
        type="password"
        icon="lock-closed-outline"
        label="Contraseña"
        autoComplete="current-password"
        [control]="$any(formAuth).get('password')"
      ></app-custom-input>
      <div class="ion-text-end">
        <ion-button
          type="button"
          fill="clear"
          size="small"
          routerLink="forgot-password"
        >
          ¿Olvidaste tu contraseña?
        </ion-button>
      </div>
      <ion-button
        type="submit"
        [disabled]="formAuth.invalid || isSubmitting"
        expand="block"
        color="primary"
        class="button-submit"
      >
        {{ isSubmitting ? 'Ingresando...' : 'Iniciar sesión' }}
      </ion-button>
    </form>
  </div>
</ion-content>
