<app-header title="Registrar animal" [backButton]="backUrl"></app-header>

<ion-content>
  <ion-grid fixed>
    <ion-row>
      <ion-col size="12">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Nuevo animal</ion-card-title>
            <ion-card-subtitle>Formulario pendiente</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            Próximo paso: crear el formulario mínimo para especie, identificación, sexo, fecha de ingreso, estado y potrero.
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
