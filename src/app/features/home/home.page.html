<app-header title="Inicio" [isMenuButton]="true"></app-header>
<ion-content class="home-content">
  <ion-grid fixed class="home-grid">
    <ion-row>
      <ion-col size="12" size-md="4" size-lg="4">
        <ion-card
          class="home-card"
          button
          aria-label="Abrir Fincas"
          (click)="goToFarms()"
        >
          <img
            class="home-card__image"
            alt=""
            src="assets/img/home/farms.webp"
            width="1600"
            height="600"
            decoding="async"
            fetchpriority="high"
          />

          <ion-card-header>
            <ion-card-title>Fincas</ion-card-title>
            <ion-card-subtitle>Registro de terrenos</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            Consulta y registra tus terrenos.
          </ion-card-content>
        </ion-card>
      </ion-col>
      <ion-col size="12" size-md="4" size-lg="4">
        <ion-card
          class="home-card"
          button
          aria-label="Abrir Nacimientos"
          (click)="goToBirths()"
        >
          <img
            class="home-card__image"
            alt=""
            src="assets/img/home/births.webp"
            width="1600"
            height="600"
            loading="lazy"
            decoding="async"
          />

          <ion-card-header>
            <ion-card-title>Nacimientos</ion-card-title>
            <ion-card-subtitle>Registro reproductivo</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            Consulta y registra nacimientos de animales.
          </ion-card-content>
        </ion-card>
      </ion-col>
      <ion-col size="12" size-md="4" size-lg="4">
        <ion-card
          class="home-card"
          button
          aria-label="Abrir Reportes"
          (click)="goToReports()"
        >
          <img
            class="home-card__image"
            alt=""
            src="assets/img/home/reports.webp"
            width="1600"
            height="600"
            loading="lazy"
            decoding="async"
          />

          <ion-card-header>
            <ion-card-title>Reportes</ion-card-title>
            <ion-card-subtitle>Descarga tus reportes</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            Crea reportes para consultar tus números.
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
