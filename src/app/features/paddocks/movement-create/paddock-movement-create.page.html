<app-header title="Movimiento de potrero" [backButton]="backUrl"></app-header>

<ion-content>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <ion-list>
      <ion-item>
        <ion-label position="stacked">Animal</ion-label>
        <ion-select
          formControlName="animalId"
          placeholder="Seleccionar animal"
          (ionChange)="onAnimalChange($event.detail.value)"
        >
          <ion-select-option *ngFor="let animal of animals" [value]="animal.id">
            {{ animal.code }} - {{ animal.species }}
          </ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item lines="none" *ngIf="selectedAnimal">
        <ion-label>
          Potrero actual:
          <strong>{{ getPaddockName(selectedAnimal.paddockId) }}</strong>
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Potrero destino</ion-label>
        <ion-select
          formControlName="toPaddockId"
          placeholder="Seleccionar potrero"
        >
          <ion-select-option
            *ngFor="let paddock of paddocks"
            [value]="paddock.id"
          >
            {{ paddock.name }}
          </ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Fecha de movimiento</ion-label>
        <ion-input type="date" formControlName="movementDate"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Notas</ion-label>
        <ion-textarea
          formControlName="notes"
          placeholder="Observaciones"
        ></ion-textarea>
      </ion-item>
    </ion-list>

    <div class="ion-padding">
      <ion-button expand="block" type="submit"> Guardar movimiento </ion-button>
    </div>
  </form>
</ion-content>
