<app-header title="Fincas" [backButton]="backUrl"></app-header>

<ion-content>
  <ion-grid fixed class="list-page-grid">
    <ion-row>
      <ion-col size="12">
        <div class="list-toolbar">
        <ion-searchbar
          aria-label="Buscar finca"
          placeholder="Buscar finca"
          animated="true"
          debounce="300"
          [disabled]="isLoading || hasLoadError || farms.length === 0"
          (ionInput)="onSearch($event)"
        ></ion-searchbar>

        <ion-button
          class="list-toolbar__action"
          color="primary"
          aria-label="Registrar finca"
          (click)="goToCreateFarm()"
        >
          <ion-icon
            name="add-outline"
            slot="icon-only"
            aria-hidden="true"
          ></ion-icon>
        </ion-button>
        </div>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col>
        <app-list-state
          *ngIf="isLoading"
          state="loading"
          title="Cargando fincas"
          description="Estamos consultando tus fincas registradas."
        ></app-list-state>

        <app-list-state
          *ngIf="!isLoading && hasLoadError"
          state="error"
          title="No pudimos cargar las fincas"
          description="Comprueba tu conexión e inténtalo nuevamente."
          actionLabel="Reintentar"
          (action)="loadFarms()"
        ></app-list-state>

        <app-list-state
          *ngIf="!isLoading && !hasLoadError && farms.length === 0"
          state="empty"
          icon="business-outline"
          title="Aún no tienes fincas"
          description="Registra tu primera finca para comenzar a gestionar animales y potreros."
          actionLabel="Registrar finca"
          (action)="goToCreateFarm()"
        ></app-list-state>

        <app-list-state
          *ngIf="
            !isLoading &&
            !hasLoadError &&
            farms.length > 0 &&
            filteredFarms.length === 0
          "
          state="empty"
          icon="search-outline"
          title="Sin resultados"
          description="No encontramos fincas que coincidan con la búsqueda."
        ></app-list-state>

        <ion-list
          *ngIf="!isLoading && !hasLoadError && filteredFarms.length > 0"
          class="data-list"
        >
          <ion-item
            *ngFor="let farm of filteredFarms; trackBy: trackByFarmId"
            lines="full"
          >
            <ion-label>
              <h2>{{ farm.name }}</h2>
              <p *ngIf="farm.department || farm.municipality">
                {{ farm.department || '' }} {{ farm.municipality || '' }}
              </p>
              <p *ngIf="farm.productionType">
                Tipo: {{ productionTypeLabels[farm.productionType] }}
              </p>
              <p *ngIf="isActiveFarm(farm)">Finca activa</p>
            </ion-label>

            <ion-button
              slot="end"
              fill="clear"
              color="primary"
              *ngIf="!isActiveFarm(farm)"
              (click)="setActiveFarm(farm)"
              [attr.aria-label]="'Usar finca ' + farm.name"
            >
              Usar
            </ion-button>

            <ion-icon
              slot="end"
              color="success"
              name="checkmark-circle-outline"
              *ngIf="isActiveFarm(farm)"
              aria-label="Finca activa"
            ></ion-icon>
          </ion-item>
        </ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
