<app-header title="Fincas" [backButton]="backUrl"></app-header>

<ion-content>
  <ion-grid fixed>
    <ion-row class="ion-align-items-center">
      <ion-col size="9" size-md="10">
        <ion-searchbar
          placeholder="Buscar finca"
          animated="true"
          debounce="300"
          disabled="true"
        ></ion-searchbar>
      </ion-col>

      <ion-col size="3" size-md="2">
        <ion-button expand="block" color="success" (click)="goToCreateFarm()">
          <ion-icon name="add-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col>
        <ion-card *ngIf="isLoading">
          <ion-card-content>
            <ion-item lines="none">
              <ion-spinner slot="start" name="crescent"></ion-spinner>
              <ion-label>Cargando fincas...</ion-label>
            </ion-item>
          </ion-card-content>
        </ion-card>

        <ion-card *ngIf="!isLoading && farms.length === 0">
          <ion-card-content>
            Aún no tienes fincas registradas.
          </ion-card-content>
        </ion-card>

        <ion-list *ngIf="!isLoading && farms.length">
          <ion-item *ngFor="let farm of farms" lines="full">
            <ion-label>
              <h2>{{ farm.name }}</h2>
              <p *ngIf="farm.department || farm.municipality">
                {{ farm.department || '' }} {{ farm.municipality || '' }}
              </p>
              <p *ngIf="farm.productionType">Tipo: {{ farm.productionType }}</p>
              <p *ngIf="isActiveFarm(farm)">Finca activa</p>
            </ion-label>

            <ion-button
              slot="end"
              fill="clear"
              color="success"
              *ngIf="!isActiveFarm(farm)"
              (click)="setActiveFarm(farm)"
            >
              Usar
            </ion-button>

            <ion-icon
              slot="end"
              color="success"
              name="checkmark-circle-outline"
              *ngIf="isActiveFarm(farm)"
            ></ion-icon>
          </ion-item>
        </ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
