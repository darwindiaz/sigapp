<app-header title="Nacimientos" [backButton]="backUrl"></app-header>

<ion-content>
  <ion-grid fixed class="list-page-grid">
    <ion-row>
      <ion-col size="12">
        <div class="list-toolbar">
        <ion-searchbar
          placeholder="Buscar nacimiento"
          animated="true"
          debounce="300"
          [disabled]="isLoading || hasLoadError || births.length === 0"
          (ionInput)="onSearch($event)"
        ></ion-searchbar>

        <ion-button
          class="list-toolbar__action"
          color="primary"
          aria-label="Registrar nacimiento"
          (click)="goToCreateBirth()"
        >
          <ion-icon
            name="add-outline"
            slot="icon-only"
            aria-hidden="true"
          ></ion-icon>
        </ion-button>
        </div>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col>
        <app-list-state
          *ngIf="isLoading"
          state="loading"
          title="Cargando nacimientos"
          description="Estamos consultando el registro reproductivo."
        ></app-list-state>

        <app-list-state
          *ngIf="!isLoading && hasLoadError"
          state="error"
          title="No pudimos cargar los nacimientos"
          description="Comprueba tu conexión e inténtalo nuevamente."
          actionLabel="Reintentar"
          (action)="loadBirths()"
        ></app-list-state>

        <app-list-state
          *ngIf="!isLoading && !hasLoadError && births.length === 0"
          state="empty"
          icon="heart-outline"
          title="Aún no hay nacimientos"
          description="Registra el primer nacimiento de la finca para iniciar el historial reproductivo."
          actionLabel="Registrar nacimiento"
          (action)="goToCreateBirth()"
        ></app-list-state>

        <app-list-state
          *ngIf="
            !isLoading &&
            !hasLoadError &&
            births.length > 0 &&
            filteredBirths.length === 0
          "
          state="empty"
          icon="search-outline"
          title="Sin resultados"
          description="No encontramos nacimientos que coincidan con la búsqueda."
        ></app-list-state>

        <ion-list
          *ngIf="!isLoading && !hasLoadError && filteredBirths.length > 0"
          class="data-list"
        >
          <ion-item
            *ngFor="let birth of filteredBirths; trackBy: trackByBirthId"
            lines="full"
          >
            <ion-label>
              <h2>Cría: {{ getAnimalLabel(birth.calfId) }}</h2>
              <p>
                <strong>Madre:</strong> {{ getAnimalLabel(birth.motherId) }}
              </p>
              <p *ngIf="birth.fatherId">
                <strong>Padre:</strong> {{ getAnimalLabel(birth.fatherId) }}
              </p>
              <p>
                <strong>Fecha:</strong> {{ birth.date | date: 'dd/MM/yyyy' }}
              </p>
              <p><strong>Sexo:</strong> {{ sexLabels[birth.sex] }}</p>
              <p>
                <strong>Estado:</strong> {{ birthStatusLabels[birth.status] }}
              </p>
              <p *ngIf="birth.weight">
                <strong>Peso:</strong> {{ birth.weight }} kg
              </p>
            </ion-label>
          </ion-item>
        </ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
