<ion-menu
  contentId="main-content"
  menuId="main-menu"
  type="overlay"
  aria-label="Navegación principal"
>
  <ion-header>
    <ion-toolbar color="primary" class="side-menu-toolbar">
      <ion-title class="side-menu-title">SIGAPP</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <div class="side-menu-content">
      <ion-list class="side-menu-list">
        <ion-menu-toggle auto-hide="true">
          <ion-item button detail="false" (click)="goToHome()">
            <ion-icon
              name="home-outline"
              slot="start"
              aria-hidden="true"
            ></ion-icon>
            <ion-label>Inicio</ion-label>
          </ion-item>

          <ion-item button detail="false" (click)="goToFarmSettings()">
            <ion-icon
              name="business-outline"
              slot="start"
              aria-hidden="true"
            ></ion-icon>
            <ion-label>Fincas</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>

      <ion-list class="side-menu-footer">
        <ion-menu-toggle auto-hide="true">
          <ion-item
            button
            detail="false"
            class="sign-out-item"
            (click)="signOut()"
          >
            <ion-icon
              name="log-out-outline"
              slot="start"
              aria-hidden="true"
            ></ion-icon>
            <ion-label>Cerrar sesión</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </div>
  </ion-content>
</ion-menu>

<ion-tabs id="main-content" class="main-tabs">
  <ion-tab-bar slot="bottom" class="main-tab-bar">
    <ion-tab-button tab="home" href="/main/home" aria-label="Inicio">
      <ion-icon name="home-outline" aria-hidden="true"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="paddocks" href="/main/paddocks" aria-label="Potreros">
      <ion-icon name="grid-outline" aria-hidden="true"></ion-icon>
      <ion-label>Potreros</ion-label>
    </ion-tab-button>

    <ion-tab-button
      class="main-action-placeholder"
      (click)="openRegisterOptions($event)"
      aria-label="Abrir registro rápido"
    >
      <ion-label>Registrar</ion-label>
    </ion-tab-button>

    <ion-tab-button
      tab="inventory"
      href="/main/inventory"
      aria-label="Inventario"
    >
      <ion-icon name="list-outline" aria-hidden="true"></ion-icon>
      <ion-label>Inventario</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="health" href="/main/health" aria-label="Salud">
      <ion-icon name="medkit-outline" aria-hidden="true"></ion-icon>
      <ion-label>Salud</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

  <ion-fab
    vertical="bottom"
    horizontal="center"
    slot="fixed"
    class="main-action-fab"
  >
    <ion-fab-button
      (click)="openRegisterOptions($event)"
      aria-label="Abrir registro rápido"
    >
      <ion-icon name="add-outline" aria-hidden="true"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-tabs>
