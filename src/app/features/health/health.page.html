<app-header title="Salud" [backButton]="backUrl"></app-header>

<ion-content>
  <ion-grid fixed>
    <ion-row class="ion-align-items-center">
      <ion-col size="9" size-md="10">
        <ion-searchbar
          placeholder="Buscar evento sanitario"
          animated="true"
          debounce="300"
          (ionInput)="onSearch($event)"
        ></ion-searchbar>
      </ion-col>

      <ion-col size="3" size-md="2">
        <ion-button
          expand="block"
          color="success"
          (click)="goToCreateVaccination()"
        >
          <ion-icon name="add-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <ion-card *ngIf="isLoading">
          <ion-card-content>
            <ion-item lines="none">
              <ion-spinner slot="start" name="crescent"></ion-spinner>
              <ion-label>Cargando eventos...</ion-label>
            </ion-item>
          </ion-card-content>
        </ion-card>

        <ion-card *ngIf="!isLoading && this.filteredHealthEvents.length === 0">
          <ion-card-content>
            Aún no hay eventos sanitarios registrados o busca otro parametro.
          </ion-card-content>
        </ion-card>

        <ng-container *ngIf="!isLoading && filteredHealthEvents.length">
          <ion-list>
            <ion-item *ngFor="let event of filteredHealthEvents" lines="full">
              <ion-label>
                <h2>{{ getEventTypeLabel(event.type) }}</h2>
                <p>Producto: {{ event.product || 'Sin producto' }}</p>
                <p>
                  <strong>Animal:</strong> {{ getAnimalLabel(event.animalId) }}
                </p>
                <p>Fecha: {{ event.date | date: 'dd/MM/yyyy' }}</p>
                <p *ngIf="event.dose">Dosis: {{ event.dose }}</p>
              </ion-label>
            </ion-item>
          </ion-list>
        </ng-container>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
