<app-header title="Salud" [backButton]="backUrl"></app-header>

<ion-content>
  <ion-grid fixed class="list-page-grid">
    <ion-row>
      <ion-col size="12">
        <div class="list-toolbar">
        <ion-searchbar
          placeholder="Buscar evento sanitario"
          animated="true"
          debounce="300"
          [disabled]="isLoading || hasLoadError || healthEvents.length === 0"
          (ionInput)="onSearch($event)"
        ></ion-searchbar>

        <ion-button
          class="list-toolbar__action"
          color="primary"
          aria-label="Registrar evento sanitario"
          (click)="goToCreateVaccination()"
        >
          <ion-icon
            name="add-outline"
            slot="icon-only"
            aria-hidden="true"
          ></ion-icon>
        </ion-button>
        </div>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <app-list-state
          *ngIf="isLoading"
          state="loading"
          title="Cargando eventos sanitarios"
          description="Estamos consultando el historial de salud de la finca."
        ></app-list-state>

        <app-list-state
          *ngIf="!isLoading && hasLoadError"
          state="error"
          title="No pudimos cargar los eventos"
          description="Comprueba tu conexión e inténtalo nuevamente."
          actionLabel="Reintentar"
          (action)="loadHealthEvents()"
        ></app-list-state>

        <app-list-state
          *ngIf="!isLoading && !hasLoadError && healthEvents.length === 0"
          state="empty"
          icon="medkit-outline"
          title="Aún no hay eventos sanitarios"
          description="Registra una vacunación para comenzar el historial sanitario de los animales."
          actionLabel="Registrar vacunación"
          (action)="goToCreateVaccination()"
        ></app-list-state>

        <app-list-state
          *ngIf="
            !isLoading &&
            !hasLoadError &&
            healthEvents.length > 0 &&
            filteredHealthEvents.length === 0
          "
          state="empty"
          icon="search-outline"
          title="Sin resultados"
          description="No encontramos eventos sanitarios que coincidan con la búsqueda."
        ></app-list-state>

        <ng-container
          *ngIf="
            !isLoading && !hasLoadError && filteredHealthEvents.length > 0
          "
        >
          <ion-list class="data-list">
            <ion-item
              *ngFor="
                let event of filteredHealthEvents;
                trackBy: trackByHealthEventId
              "
              lines="full"
            >
              <ion-label>
                <h2>{{ getEventTypeLabel(event.type) }}</h2>
                <p>Producto: {{ event.product || 'Sin producto' }}</p>
                <p>
                  <strong>Animal:</strong> {{ getAnimalLabel(event.animalId) }}
                </p>
                <p>Fecha: {{ event.date | date: 'dd/MM/yyyy' }}</p>
                <p *ngIf="event.dose">Dosis: {{ event.dose }}</p>
              </ion-label>
            </ion-item>
          </ion-list>
        </ng-container>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
