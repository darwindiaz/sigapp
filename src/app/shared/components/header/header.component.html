<ion-header>
  <ion-toolbar color="primary" class="app-toolbar">
    <ion-buttons slot="start">
      <ion-menu-button
        *ngIf="isMenuButton"
        menu="main-menu"
        aria-label="Abrir menú"
      ></ion-menu-button>

      <ion-back-button
        *ngIf="backButton"
        [defaultHref]="backButton"
        text=""
        aria-label="Volver"
      ></ion-back-button>

      <ion-button
        *ngIf="isModal"
        (click)="dismissModal()"
        aria-label="Cerrar"
      >
        <ion-icon name="close" aria-hidden="true"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title class="header-copy">
      <span class="header-title">{{ title }}</span>
      <span class="subtitle">
        {{ activeFarmName ? "Finca: " + activeFarmName : nameApp }}
      </span>
    </ion-title>

    <ion-buttons slot="end">
      <ion-button
        *ngIf="isSignOut"
        (click)="signOut()"
        aria-label="Cerrar sesión"
      >
        <ion-icon name="power" aria-hidden="true"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
